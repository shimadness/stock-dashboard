<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Stock Watch</title>
<meta name="description" content="AIサプライチェーン73社の日次株価ダッシュボード">
<style>
:root{
  --bg:#f6f7f9;--card:#ffffff;--ink:#16181d;--muted:#6b7280;--line:#e5e7eb;
  --up:#0f9d58;--down:#d93025;--flat:#6b7280;--accent:#2563eb;--chip:#eef2ff;
  --up-bg:rgba(15,157,88,.12);--down-bg:rgba(217,48,37,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1115;--card:#171a21;--ink:#e6e8ee;--muted:#9aa3b2;--line:#262b36;
  --up:#3ddc84;--down:#ff6b5e;--flat:#9aa3b2;--accent:#7aa2ff;--chip:#1f2533;
  --up-bg:rgba(61,220,132,.14);--down-bg:rgba(255,107,94,.14);
}}
:root[data-theme="dark"]{
  --bg:#0f1115;--card:#171a21;--ink:#e6e8ee;--muted:#9aa3b2;--line:#262b36;
  --up:#3ddc84;--down:#ff6b5e;--flat:#9aa3b2;--accent:#7aa2ff;--chip:#1f2533;
  --up-bg:rgba(61,220,132,.14);--down-bg:rgba(255,107,94,.14);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
h1 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:8px}
.meta{color:var(--muted);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 -16px 16px;padding:8px 16px;position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 12px;cursor:pointer;font:inherit;font-size:13px}
.seg button.on{background:var(--accent);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer}
.card .lbl{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .val{font-size:22px;font-weight:700;margin:2px 0}
.card .sub{font-size:11px;color:var(--muted)}
.up{color:var(--up)}.down{color:var(--down)}.flat{color:var(--flat)}
.grid{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:960px){.grid{grid-template-columns:minmax(0,1fr) 360px}.grid>.main{order:0}.grid>.side{order:1}}
section.sector{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
section.sector h2{font-size:15px;margin:0;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
section.sector h2 span.avg{font-size:13px;font-weight:600}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:11px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none;position:sticky;top:0;background:var(--card)}
th.sorted{color:var(--accent)}
td:first-child,th:first-child{text-align:left}
tr:last-child td{border-bottom:0}
td.name{font-weight:600}
td.name small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.badge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:4px;vertical-align:middle}
.star{color:#f59e0b}
td.pct{font-variant-numeric:tabular-nums}
td.pct.hi{background:var(--up-bg)}td.pct.lo{background:var(--down-bg)}
svg.spark{width:84px;height:24px;vertical-align:middle}
.stale{opacity:.5}
.side .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel select{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:3px 6px}
.headline{font-size:16px;font-weight:700;margin:4px 0 8px}
.panel p{margin:6px 0;font-size:13px}
.panel ul{margin:6px 0;padding-left:18px;font-size:13px}
.panel li{margin:4px 0}
.mover b{font-weight:700}
.sug{border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.sug b{display:block}
.sug .why{color:var(--muted)}
.empty{color:var(--muted);font-size:13px}
details summary{cursor:pointer;color:var(--muted);font-size:12px}

/* AI stance panel */
section.ai{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
section.ai h2{font-size:15px;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.disc{font-size:11px;color:var(--muted);font-weight:400}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:12px}
.tile{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.tile .lbl{font-size:11px;color:var(--muted)}.tile .val{font-size:20px;font-weight:700}.tile .sub{font-size:11px;color:var(--muted)}
.ai2{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:960px){.ai2{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.ai h4{margin:8px 0 6px;font-size:13px}
.tiers{display:grid;grid-template-columns:1fr;gap:12px;margin-bottom:12px}
@media(min-width:960px){.tiers{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tier{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}
.tier h4{margin:0 0 6px;display:flex;align-items:center;gap:6px}
.tier h4 small{color:var(--muted);font-weight:400}
.tier .grp{font-size:11px;color:var(--muted);margin:8px 0 2px;font-weight:600}
.tier .call{background:var(--card);margin:6px 0}
.pass{font-size:12px;color:var(--muted);border:1px dashed var(--line);border-radius:8px;padding:6px 8px;margin:6px 0}
.res.wd{background:var(--chip);color:var(--muted)}
svg.trend{width:100%;height:120px;display:block}
.call{border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:13px}
.call .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.call .top b{font-size:14px}
.stance{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}
.stance.bull{background:var(--up-bg);color:var(--up)}.stance.bear{background:var(--down-bg);color:var(--down)}
.bar{height:4px;background:var(--line);border-radius:2px;margin:6px 0 4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.call .why{color:var(--muted);font-size:12px;margin-top:4px}
.call .inv{font-size:12px;margin-top:2px}
.res{font-size:11px;padding:1px 7px;border-radius:999px;font-weight:600}
.res.hit{background:var(--up-bg);color:var(--up)}.res.miss{background:var(--down-bg);color:var(--down)}.res.flat{background:var(--chip);color:var(--muted)}
table.closed th,table.closed td{padding:5px 8px;font-size:12px}

/* sector index chart */
section.idx{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:18px}
section.idx h2{font-size:15px;margin:0 0 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
svg.idx{width:100%;height:260px;display:block;touch-action:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:8px;font-size:12px}
.legend span{display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:2px 6px;border-radius:6px;user-select:none}
.legend span.off{opacity:.35}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.legend b{font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--muted);min-height:18px;margin-top:4px;font-variant-numeric:tabular-nums}
td.name{cursor:pointer}td.name:hover{color:var(--accent)}
/* ticker modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}
.mbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:14px;width:min(820px,100%);max-height:92vh;overflow:auto;padding:16px}
.mbox h3{margin:0 0 4px;font-size:17px;display:flex;align-items:center;gap:8px}
.mbox .x{margin-left:auto;border:0;background:var(--chip);color:var(--ink);border-radius:999px;width:28px;height:28px;cursor:pointer;font-size:16px}
svg.big{width:100%;height:300px;display:block;touch-action:none}
.kv{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin:6px 0}
.kv b{color:var(--ink);font-variant-numeric:tabular-nums}
footer{color:var(--muted);font-size:12px;margin:24px 0 8px;text-align:center}
footer a{color:var(--accent)}
/* when the sector column is narrower than the full table, keep only the selected period column */
#sectors.narrow th.per:not(.sel),#sectors.narrow td.per:not(.sel){display:none}
#sectors.narrow svg.spark{width:110px}
th.sel{color:var(--accent)}
@media(max-width:640px){
  th.fh,td.fh{display:none}
  #sectors.narrow svg.spark{width:84px}
  .card .val{font-size:18px}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>AI Stock Watch <small id="count"></small></h1>
  <div class="meta" id="meta">読み込み中…</div>
</header>

<div class="controls">
  <div class="seg" id="period">
    <button data-p="chg_1d" class="on">1日</button><button data-p="chg_5d">5日</button><button data-p="chg_1m">1ヶ月</button><button data-p="chg_3m">3ヶ月</button><button data-p="chg_ytd">年初来</button>
  </div>
  <div class="seg" id="market">
    <button data-m="ALL" class="on">全市場</button><button data-m="US">米国</button><button data-m="JP">日本</button><button data-m="KR">韓国</button><button data-m="HK">香港</button>
  </div>
</div>

<div class="cards" id="cards"></div>

<section class="idx" id="idx">
  <h2><span>業界インデックス比較 <span class="disc">各業界を期間の初日=100に揃えた等加重指数</span></span>
    <div class="seg" id="idxwin"><button data-w="63" class="on">3ヶ月</button><button data-w="126">6ヶ月</button><button data-w="252">1年</button></div></h2>
  <div id="idxbody" class="empty">読み込み中…</div>
</section>

<section class="ai" id="ai">
  <h2>今のポジション提案と的中率 <span class="disc">毎朝AIが短期・中期・長期ごとに買い候補/売り・回避候補を宣言し、期限か撤回時にスクリプトが機械的に採点。投資助言ではなく、AIに売買提案を任せられるかの検証記録。売買の判断と金額はあなた自身で。</span></h2>
  <div id="aibody" class="empty">まだ見解はありません。</div>
</section>

<div class="grid">
  <div class="main" id="sectors"></div>
  <aside class="side">
    <div class="panel" id="report">
      <h3>デイリーレポート <select id="rsel"></select></h3>
      <div id="rbody" class="empty">レポートはまだありません。</div>
    </div>
    <div class="panel" id="sugpanel">
      <h3>チェック候補の提案</h3>
      <div id="sugbody" class="empty">まだ提案はありません。</div>
    </div>
  </aside>
</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="mbox" id="mbox"></div></div>

<footer>データ: Yahoo Finance（終値ベース・約15分遅延）／毎朝7時JSTに自動更新 · <a href="https://github.com/shimadness/stock-dashboard">GitHub</a></footer>
</div>

<script>
const $=s=>document.querySelector(s);
const fmtPct=v=>v==null?'—':(v>0?'+':'')+v.toFixed(2)+'%';
const cls=v=>v==null?'flat':v>0.0001?'up':v<-0.0001?'down':'flat';
const fmtPrice=(v,cur)=>v==null?'—':(cur==='JPY'||cur==='KRW')?Math.round(v).toLocaleString():v.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const PERIODS={chg_1d:'1日',chg_5d:'5日',chg_1m:'1ヶ月',chg_3m:'3ヶ月',chg_ytd:'年初来'};
let WL,LATEST,REPORTS=[],state={period:'chg_1d',market:'ALL',sort:{key:'chg_1d',dir:-1}};

function spark(arr){
  if(!arr||arr.length<2)return'';
  const w=84,h=24,min=Math.min(...arr),max=Math.max(...arr),r=max-min||1;
  const pts=arr.map((v,i)=>[(i/(arr.length-1))*w,h-2-((v-min)/r)*(h-4)]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const c=arr[arr.length-1]>=arr[0]?'var(--up)':'var(--down)';
  return`<svg class="spark" viewBox="0 0 ${w} ${h}"><path d="${d}" fill="none" stroke="${c}" stroke-width="1.5"/></svg>`;
}
function avg(xs){const v=xs.filter(x=>x!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;}
function visible(){return LATEST.items.filter(i=>state.market==='ALL'||i.market===state.market);}

function renderCards(){
  const p=state.period,items=visible();
  $('#cards').innerHTML=WL.sectors.map(s=>{
    const xs=items.filter(i=>i.sector===s.id);if(!xs.length)return'';
    const a=avg(xs.map(i=>i[p]));
    const best=xs.filter(i=>i[p]!=null).sort((x,y)=>y[p]-x[p]);
    return`<div class="card" onclick="document.getElementById('sec-${s.id}').scrollIntoView({behavior:'smooth'})">
      <div class="lbl">${s.label}</div><div class="val ${cls(a)}">${fmtPct(a)}</div>
      <div class="sub">${xs.length}社${best.length?` · 高 ${best[0].name} ${fmtPct(best[0][p])}`:''}</div></div>`;
  }).join('');
}
function renderSectors(){
  const p=state.period,{key,dir}=state.sort,items=visible();
  const cols=[['name','銘柄'],['last','株価'],['chg_1d','1日'],['chg_5d','5日'],['chg_1m','1ヶ月'],['chg_3m','3ヶ月'],['chg_ytd','年初来'],['from_high','52週高値比'],['spark','30日推移']];
  $('#sectors').innerHTML=WL.sectors.map(s=>{
    let xs=items.filter(i=>i.sector===s.id);if(!xs.length)return'';
    xs=xs.slice().sort((a,b)=>{
      if(key==='name')return dir*a.name.localeCompare(b.name,'ja');
      const av=a[key],bv=b[key];if(av==null)return 1;if(bv==null)return -1;return dir*(av-bv);});
    const a=avg(xs.map(i=>i[p]));
    const vals=xs.map(i=>i[p]).filter(v=>v!=null);
    const hi=vals.length>2?[...vals].sort((x,y)=>y-x)[0]:null,lo=vals.length>2?[...vals].sort((x,y)=>x-y)[0]:null;
    return`<section class="sector" id="sec-${s.id}"><h2>${s.label}<span class="avg ${cls(a)}">${PERIODS[p]}平均 ${fmtPct(a)}</span></h2>
    <div style="overflow-x:auto"><table><thead><tr>${cols.map(([k,l])=>`<th data-k="${k}" class="${k===key?'sorted':''} ${k.startsWith('chg_')?'per':''} ${k===p?'sel':''} ${k==='from_high'?'fh':''}">${l}${k===key?(dir<0?' ▼':' ▲'):''}</th>`).join('')}</tr></thead><tbody>
    ${xs.map(i=>`<tr class="${i.stale?'stale':''}" title="${i.stale?'取得失敗・前回値':''}">
      <td class="name" onclick="openModal('${i.ticker}')">${i.core?'<span class="star">★</span> ':''}${i.name}<span class="badge">${WL.markets[i.market]}</span><small>${i.ticker}${i.last_date?' · '+i.last_date.slice(5):''}</small></td>
      <td>${fmtPrice(i.last,i.currency)}<span class="badge">${i.currency||''}</span></td>
      ${['chg_1d','chg_5d','chg_1m','chg_3m','chg_ytd'].map(k=>`<td class="pct per ${k===p?'sel':''} ${cls(i[k])} ${k===p&&i[k]===hi?'hi':''} ${k===p&&i[k]===lo?'lo':''}">${fmtPct(i[k])}</td>`).join('')}
      <td class="pct fh ${cls(i.from_high)}">${fmtPct(i.from_high)}</td>
      <td>${spark(i.spark)}</td></tr>`).join('')}
    </tbody></table></div></section>`;
  }).join('');
  document.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k;if(k==='spark')return;
    state.sort=state.sort.key===k?{key:k,dir:-state.sort.dir}:{key:k,dir:k==='name'?1:-1};renderSectors();});
}
function renderReport(date){
  const r=REPORTS.find(x=>x.date===date);
  if(!r){$('#rbody').innerHTML='<span class="empty">レポートはまだありません。</span>';return;}
  const secLabel=id=>(WL.sectors.find(s=>s.id===id)||{}).label||id;
  $('#rbody').innerHTML=`
    <div class="headline">${esc(r.headline)}</div>
    <p>${esc(r.market_summary)}</p>
    ${r.movers?.length?`<h4 style="margin:10px 0 4px;font-size:13px">注目の動き</h4><ul>${r.movers.map(m=>`<li class="mover"><b class="${m.direction==='up'?'up':m.direction==='down'?'down':''}">${esc(m.ticker)}</b> ${esc(m.comment)}</li>`).join('')}</ul>`:''}
    ${r.sector_notes?.length?`<details><summary>業界別メモ（${r.sector_notes.length}）</summary><ul>${r.sector_notes.map(n=>`<li><b>${esc(secLabel(n.sector))}</b>: ${esc(n.note)}</li>`).join('')}</ul></details>`:''}
    ${r.ai_review?`<h4 style="margin:10px 0 4px;font-size:13px">AIの自己振り返り</h4><p>${esc(r.ai_review)}</p>`:''}
    ${r.watch_next?.length?`<h4 style="margin:10px 0 4px;font-size:13px">次に見るべきこと</h4><ul>${r.watch_next.map(w=>`<li>${esc(w)}</li>`).join('')}</ul>`:''}`;
  const sugs=[];REPORTS.forEach(rep=>(rep.suggestions||[]).forEach(s=>sugs.push({...s,date:rep.date})));
  $('#sugbody').innerHTML=sugs.length?sugs.slice(0,12).map(s=>`<div class="sug"><b>${esc(s.name)} <span class="badge">${esc(s.ticker)}</span> <span class="badge">${esc(secLabel(s.sector))}</span></b><span class="why">${esc(s.reason)}</span><div class="meta">${s.date} 提案</div></div>`).join('')+'<p class="meta">採用したい企業はチャットで伝えてください。watchlist.json に追加されます。</p>':'<span class="empty">まだ提案はありません。</span>';
}

let CALLS=null,SCORE=null;
const STANCE={bull:'強気',bear:'弱気'},RES={hit:'的中',miss:'外れ',flat:'横ばい'};
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function trend(hist){
  const pts=hist.filter(h=>h.hit_rate!=null);
  if(pts.length<2)return'<p class="meta">判定が2日分以上たまると推移グラフが出ます。</p>';
  const w=600,h=120,pl=30,pr=8,pt=8,pb=20,iw=w-pl-pr,ih=h-pt-pb;
  const x=i=>pl+i/(pts.length-1)*iw,y=v=>pt+ih-(v/100)*ih;
  const line=k=>pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+','+y(p[k]).toFixed(1)).join(' ');
  const grid=[0,25,50,75,100].map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-4}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${v}</text>`).join('');
  const lab=[0,pts.length-1].map(i=>`<text x="${x(i)}" y="${h-4}" font-size="10" text-anchor="${i?'end':'start'}" fill="var(--muted)">${pts[i].date.slice(5)}</text>`).join('');
  const ex=pts.filter(p=>p.beat_bench_rate!=null).length===pts.length?`<path d="${line('beat_bench_rate')}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>`:'';
  return`<svg class="trend" viewBox="0 0 ${w} ${h}">${grid}${lab}${ex}<path d="${line('hit_rate')}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>
  <p class="meta">実線: 的中率（横ばい除く） · 点線: 市場（ウォッチリスト平均）に勝った割合</p>`;
}
const TIERS=[['short','短期','10営業日・約2週間'],['mid','中期','60営業日・約3ヶ月'],['long','長期','120営業日・約半年']];
const tierOf=c=>c.tier||({10:'short',20:'mid',60:'mid',120:'long'}[c.horizon]||'mid');
function callCard(c,px){
  const cur=px[c.ticker]?.last,u=cur!=null?(cur/c.entry-1)*100:null,su=u==null?null:(c.stance==='bull'?u:-u);
  const days=elapsedDays(c);
  return`<div class="call"><div class="top"><b>${esc(c.name)}</b><span class="badge">${esc(c.ticker)}</span><span class="stance ${c.stance}">${c.stance==='bull'?'買い候補':'売り・回避'}</span><span class="badge">確信度 ${'●'.repeat(c.confidence)}${'○'.repeat(3-c.confidence)}</span><span style="margin-left:auto" class="${cls(su)}">含み ${fmtPct(u)}</span></div>
    <div class="bar"><i style="width:${Math.min(100,days/c.horizon*100)}%"></i></div><div class="meta">${c.date} 宣言 · ${days}/${c.horizon}日経過 · 基準 ${fmtPrice(c.entry,px[c.ticker]?.currency)}</div>
    <div class="why">${esc(c.thesis)}</div><div class="inv">撤回条件: ${esc(c.invalidation)}</div></div>`;
}
function renderAI(){
  const el=$('#aibody');
  if(!CALLS||(!CALLS.calls.length&&!(CALLS.passes||[]).length)){el.innerHTML='<span class="empty">まだ提案はありません。明朝のルーティンから蓄積されます。</span>';return;}
  const S=SCORE?.summary||{},hist=SCORE?.history||[];
  const px=Object.fromEntries(LATEST.items.map(i=>[i.ticker,i]));
  const open=CALLS.calls.filter(c=>c.status==='open'),closed=CALLS.calls.filter(c=>c.status==='closed').sort((a,b)=>b.exit_date.localeCompare(a.exit_date));
  const f1=v=>v==null?'—':v.toFixed(1)+'%';
  const latestPass=t=>(CALLS.passes||[]).filter(p=>p.tier===t).sort((a,b)=>b.date.localeCompare(a.date))[0];
  const tiles=`<div class="tiles">
    <div class="tile"><div class="lbl">的中率（全体）</div><div class="val ${S.hit_rate==null?'':S.hit_rate>=50?'up':'down'}">${f1(S.hit_rate)}</div><div class="sub">的中${S.hit??0} / 外れ${S.miss??0} / 横ばい${S.flat??0}${S.withdrawn?` / 撤回${S.withdrawn}`:''}</div></div>
    <div class="tile"><div class="lbl">市場超過リターン（平均）</div><div class="val ${cls(S.avg_excess)}">${fmtPct(S.avg_excess)}</div><div class="sub">市場に勝った割合 ${f1(S.beat_bench_rate)}</div></div>
    ${TIERS.map(([t,l])=>{const v=S.by_tier?.[t];return`<div class="tile"><div class="lbl">${l}の的中率</div><div class="val ${v?.hit_rate==null?'':v.hit_rate>=50?'up':'down'}">${f1(v?.hit_rate)}</div><div class="sub">判定${v?.closed??0}件 · 市場超過 ${fmtPct(v?.avg_excess)}</div></div>`;}).join('')}
  </div>`;
  const tiersHtml=`<div class="tiers">${TIERS.map(([t,l,d])=>{
    const xs=open.filter(c=>tierOf(c)===t),bulls=xs.filter(c=>c.stance==='bull'),bears=xs.filter(c=>c.stance==='bear'),ps=latestPass(t);
    const body=xs.length?`${bulls.length?`<div class="grp">買い候補</div>${bulls.map(c=>callCard(c,px)).join('')}`:''}${bears.length?`<div class="grp">売り・回避候補</div>${bears.map(c=>callCard(c,px)).join('')}`:''}`:'';
    const pass=ps&&(!xs.length||ps.date===LATEST.generated_date)?`<div class="pass">${ps.date} 該当なし: ${esc(ps.reason)}</div>`:'';
    return`<div class="tier"><h4>${l} <small>${d}</small><span class="badge" style="margin-left:auto">${xs.length}/3</span></h4>${body}${pass}${!xs.length&&!pass?'<p class="empty">候補なし</p>':''}</div>`;}).join('')}</div>`;
  const closedHtml=closed.length?`<div style="overflow-x:auto"><table class="closed"><thead><tr><th>宣言</th><th>銘柄</th><th>段</th><th>見解</th><th>リターン</th><th>市場比</th><th>結果</th></tr></thead><tbody>${closed.slice(0,25).map(c=>`<tr><td>${c.date.slice(2)}</td><td style="text-align:left">${esc(c.name)}<small style="color:var(--muted)"> ${esc(c.ticker)}</small></td><td>${(TIERS.find(x=>x[0]===tierOf(c))||[])[1]||''}</td><td><span class="stance ${c.stance}">${c.stance==='bull'?'買い':'売り'}</span></td><td class="${cls(c.ret_pct)}">${fmtPct(c.ret_pct)}</td><td class="${cls(c.excess_pct)}">${fmtPct(c.excess_pct)}</td><td><span class="res ${c.result}">${RES[c.result]}</span>${c.withdrawn?`<span class="res wd" title="${esc(c.withdraw_reason||'')}">撤回</span>`:''}</td></tr>`).join('')}</tbody></table></div>
    <details style="margin-top:6px"><summary>内訳（確信度別）</summary><table class="closed"><thead><tr><th style="text-align:left">区分</th><th>判定</th><th>的中率</th><th>市場超過</th></tr></thead><tbody>${[['確信度●○○',S.by_confidence?.['1']],['確信度●●○',S.by_confidence?.['2']],['確信度●●●',S.by_confidence?.['3']]].map(([l,v])=>`<tr><td style="text-align:left">${l}</td><td>${v?.closed??0}</td><td>${f1(v?.hit_rate)}</td><td class="${cls(v?.avg_excess)}">${fmtPct(v?.avg_excess)}</td></tr>`).join('')}</tbody></table></details>`:'<p class="empty">判定済みの提案はまだありません。</p>';
  el.className='';
  el.innerHTML=tiles+tiersHtml+`<div class="ai2"><div><h4>的中率の推移</h4>${trend(hist)}</div><div><h4>判定済み（新しい順）</h4>${closedHtml}</div></div>
  <p class="meta">採点ルール: 期限または撤回日の終値が基準比 ±${SCORE?.rule?.hit_pct??1}% 以上なら方向で的中/外れ、それ未満は横ばい。撤回は撤回日の終値で採点。市場比はウォッチリスト全銘柄の同期間平均との差。</p>`;
}
function elapsedDays(c){
  // approximate trading days since entry using LATEST last_date (weekday count)
  const ld=LATEST.items.find(i=>i.ticker===c.ticker)?.last_date;if(!ld)return 0;
  let n=0,d=new Date(c.entry_date+'T00:00:00Z'),e=new Date(ld+'T00:00:00Z');
  while(d<e){d.setUTCDate(d.getUTCDate()+1);const w=d.getUTCDay();if(w!==0&&w!==6)n++;}
  return n;
}

/* ---------- long-range charts (history.json, loaded once on demand) ---------- */
let HIST=null,idxState={win:63,off:new Set()};
const PAL=['#2563eb','#d97706','#0f9d58','#d93025','#7c3aed','#0891b2','#db2777','#65a30d','#f59e0b','#475569'];
async function hist(){if(!HIST)HIST=await fetch('data/history.json?t='+Date.now()).then(r=>r.json());return HIST;}
function lineChart(series,opts){
  // series: [{name,color,pts:[[date,val],...]}] (same date axis assumed per series), opts:{w,h,fmt,base,hl}
  const w=opts.w||800,h=opts.h||260,pl=44,pr=10,pt=10,pb=22,iw=w-pl-pr,ih=h-pt-pb;
  const all=series.flatMap(s=>s.pts.map(p=>p[1])).filter(v=>v!=null);
  if(!all.length)return'';
  let lo=Math.min(...all),hi=Math.max(...all);if(opts.base!=null){lo=Math.min(lo,opts.base);hi=Math.max(hi,opts.base);}
  const pad=(hi-lo||1)*.05;lo-=pad;hi+=pad;
  const n=Math.max(...series.map(s=>s.pts.length));
  const x=i=>pl+i/(n-1)*iw,y=v=>pt+ih-(v-lo)/(hi-lo)*ih;
  const ticks=5,gl=[];for(let k=0;k<=ticks;k++){const v=lo+(hi-lo)*k/ticks;gl.push(`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-5}" y="${y(v)+4}" font-size="10" text-anchor="end" fill="var(--muted)">${opts.fmt(v)}</text>`);}
  const dates=series[0].pts.map(p=>p[0]);
  const xl=[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${x(i)}" y="${h-6}" font-size="10" text-anchor="${i===0?'start':i===n-1?'end':'middle'}" fill="var(--muted)">${dates[i]||''}</text>`);
  const basel=opts.base!=null?`<line x1="${pl}" x2="${w-pr}" y1="${y(opts.base)}" y2="${y(opts.base)}" stroke="var(--muted)" stroke-dasharray="3 3"/>`:'';
  const hl=(opts.hl||[]).map(v=>`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--flat)" stroke-dasharray="2 4" opacity=".6"/>`).join('');
  const paths=series.map(s=>`<path d="${s.pts.map((p,i)=>p[1]==null?'':(i&&s.pts[i-1][1]!=null?'L':'M')+x(i).toFixed(1)+','+y(p[1]).toFixed(1)).join(' ')}" fill="none" stroke="${s.color}" stroke-width="${s.width||1.8}" stroke-linejoin="round"/>`).join('');
  return{svg:`${gl.join('')}${xl.join('')}${basel}${hl}${paths}<line id="${opts.id}-cur" x1="0" x2="0" y1="${pt}" y2="${pt+ih}" stroke="var(--muted)" opacity="0" />`,x,n,pl,iw};
}
function attachHover(svgEl,chart,dates,onIdx){
  const cur=svgEl.querySelector('line[id$="-cur"]');
  const move=e=>{const r=svgEl.getBoundingClientRect();const vb=svgEl.viewBox.baseVal;const px=(e.clientX-r.left)/r.width*vb.width;
    let i=Math.round((px-chart.pl)/chart.iw*(chart.n-1));i=Math.max(0,Math.min(chart.n-1,i));cur.setAttribute('x1',chart.x(i));cur.setAttribute('x2',chart.x(i));cur.setAttribute('opacity','.7');onIdx(i);};
  svgEl.addEventListener('pointermove',move);svgEl.addEventListener('pointerleave',()=>{cur.setAttribute('opacity','0');onIdx(null);});
}
function unionDates(tickers,H){const set=new Set();tickers.forEach(t=>(H[t]||[]).forEach(p=>set.add(p[0])));return[...set].sort();}
function ffill(t,dates,H){const m=new Map(H[t]||[]);let last=null;return dates.map(d=>{if(m.has(d))last=m.get(d);return last;});}
async function renderIdx(){
  const H=await hist();const el=$('#idxbody');
  const items=visible();
  const tickers=items.map(i=>i.ticker).filter(t=>H[t]);
  if(!tickers.length){el.innerHTML='<span class="empty">データがありません。</span>';return;}
  const datesAll=unionDates(tickers,H);const dates=datesAll.slice(-idxState.win-1);
  const series=[];
  WL.sectors.forEach((sec,si)=>{
    const ts=items.filter(i=>i.sector===sec.id).map(i=>i.ticker).filter(t=>H[t]);if(!ts.length)return;
    const rows=ts.map(t=>ffill(t,dates,H));
    // base = first date where every ticker has a value
    let b=0;while(b<dates.length&&rows.some(r=>r[b]==null))b++;if(b>=dates.length-1)return;
    const pts=dates.map((d,i)=>[d,i<b?null:rows.reduce((a,r)=>a+r[i]/r[b],0)/rows.length*100]);
    series.push({id:sec.id,name:sec.label,color:PAL[si%PAL.length],pts,last:pts[pts.length-1][1],n:ts.length});
  });
  // equal-weight all-watchlist line
  {const rows=tickers.map(t=>ffill(t,dates,H));let b=0;while(b<dates.length&&rows.some(r=>r[b]==null))b++;
   if(b<dates.length-1)series.push({id:'ALL',name:'全体平均',color:'var(--muted)',width:2.4,pts:dates.map((d,i)=>[d,i<b?null:rows.reduce((a,r)=>a+r[i]/r[b],0)/rows.length*100]),last:null});}
  series.forEach(s=>{s.last=s.pts[s.pts.length-1][1];});
  const shown=series.filter(s=>!idxState.off.has(s.id));
  const c=lineChart(shown.length?shown:series.slice(-1),{w:800,h:260,fmt:v=>v.toFixed(0),base:100,id:'idx'});
  el.className='';
  el.innerHTML=`<svg class="idx" viewBox="0 0 800 260" id="idxsvg">${c.svg}</svg><div class="hint" id="idxhint"></div>
   <div class="legend">${series.map(s=>`<span data-id="${s.id}" class="${idxState.off.has(s.id)?'off':''}"><i style="background:${s.color}"></i>${s.name}${s.n?`<small style="color:var(--muted)">(${s.n})</small>`:''} <b class="${cls(s.last-100)}">${fmtPct(s.last-100)}</b></span>`).join('')}</div>`;
  el.querySelectorAll('.legend span').forEach(sp=>sp.onclick=()=>{const id=sp.dataset.id;idxState.off.has(id)?idxState.off.delete(id):idxState.off.add(id);renderIdx();});
  attachHover($('#idxsvg'),c,dates,i=>{$('#idxhint').textContent=i==null?'':dates[i]+'  '+shown.map(s=>s.pts[i][1]==null?'':`${s.name} ${fmtPct(s.pts[i][1]-100)}`).filter(Boolean).join(' · ');});
}
document.querySelectorAll('#idxwin button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#idxwin button').forEach(x=>x.classList.remove('on'));b.classList.add('on');idxState.win=+b.dataset.w;renderIdx();});

let modalWin=252;
async function openModal(ticker){
  const H=await hist();const it=LATEST.items.find(i=>i.ticker===ticker);const pts=(H[ticker]||[]);
  if(!it||pts.length<2)return;
  const m=$('#modal'),box=$('#mbox');m.classList.add('on');
  const draw=()=>{
    const p=pts.slice(-modalWin-1);const vals=p.map(x=>x[1]);const hi=Math.max(...vals),lo=Math.min(...vals);
    const first=vals[0],last=vals[vals.length-1];
    const ma=k=>vals.map((_,i)=>i<k-1?null:vals.slice(i-k+1,i+1).reduce((a,b)=>a+b,0)/k);
    const m50=ma(50),m200=ma(200);
    box.innerHTML=`<h3>${it.core?'<span class="star">★</span>':''}${it.name}<span class="badge">${ticker}</span><span class="badge">${WL.markets[it.market]}</span>
      <div class="seg" style="margin-left:8px"><button data-w="63" class="${modalWin===63?'on':''}">3ヶ月</button><button data-w="126" class="${modalWin===126?'on':''}">6ヶ月</button><button data-w="252" class="${modalWin===252?'on':''}">1年</button></div>
      <button class="x" onclick="closeModal()">×</button></h3>
      <div class="kv"><span>終値 <b>${fmtPrice(last,it.currency)} ${it.currency||''}</b></span><span>期間騰落 <b class="${cls(last/first*100-100)}">${fmtPct(last/first*100-100)}</b></span><span>期間高値 <b>${fmtPrice(hi,it.currency)}</b></span><span>期間安値 <b>${fmtPrice(lo,it.currency)}</b></span><span>52週高値比 <b class="${cls(it.from_high)}">${fmtPct(it.from_high)}</b></span></div>
      <svg class="big" viewBox="0 0 800 300" id="bigsvg"></svg><div class="hint" id="bighint"></div>
      <div class="legend"><span><i style="background:${last>=first?'var(--up)':'var(--down)'}"></i>終値</span><span><i style="background:#f59e0b"></i>50日移動平均</span><span><i style="background:#7c3aed"></i>200日移動平均</span><span><i style="background:var(--flat);height:1px"></i>52週高値・安値</span></div>
      ${it.note?`<p class="meta" style="margin-top:8px">${esc(it.note)}</p>`:''}`;
    const svg=$('#bigsvg');
    const c2=lineChart([{name:it.name,color:last>=first?'var(--up)':'var(--down)',pts:p,width:2},{name:'50',color:'#f59e0b',pts:p.map((x,i)=>[x[0],m50[i]]),width:1},{name:'200',color:'#7c3aed',pts:p.map((x,i)=>[x[0],m200[i]]),width:1}],{w:800,h:300,fmt:v=>fmtPrice(v,it.currency),hl:[it.high_52w,it.low_52w].filter(v=>v!=null),id:'big'});
    svg.innerHTML=c2.svg;
    attachHover(svg,c2,p.map(x=>x[0]),i=>{$('#bighint').textContent=i==null?'':`${p[i][0]}  終値 ${fmtPrice(p[i][1],it.currency)}${m50[i]!=null?`  50日線 ${fmtPrice(m50[i],it.currency)}`:''}${m200[i]!=null?`  200日線 ${fmtPrice(m200[i],it.currency)}`:''}`;});
    box.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{modalWin=+b.dataset.w;draw();});
  };
  draw();
}
function closeModal(){$('#modal').classList.remove('on');}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
async function load(){
  const bust='?t='+Date.now();
  [WL,LATEST]=await Promise.all([fetch('watchlist.json'+bust).then(r=>r.json()),fetch('data/latest.json'+bust).then(r=>r.json())]);
  const coreMap=Object.fromEntries(WL.companies.map(c=>[c.ticker,c]));
  LATEST.items.forEach(i=>{i.core=!!coreMap[i.ticker]?.core;i.note=coreMap[i.ticker]?.note;});
  $('#count').textContent=`${LATEST.items.length}社`;
  const stale=LATEST.items.filter(i=>i.stale).length;
  $('#meta').textContent=`更新 ${LATEST.generated_at.replace('T',' ').slice(0,16)} JST${stale?` · 取得失敗 ${stale}件`:''}`;
  try{
    const idx=await fetch('data/reports/index.json'+bust).then(r=>r.ok?r.json():[]);
    REPORTS=(await Promise.all(idx.slice(0,30).map(d=>fetch(`data/reports/${d}.json`+bust).then(r=>r.ok?r.json():null).catch(()=>null)))).filter(Boolean);
  }catch(e){REPORTS=[];}
  try{[CALLS,SCORE]=await Promise.all([fetch('data/calls.json'+bust).then(r=>r.ok?r.json():null),fetch('data/scorecard.json'+bust).then(r=>r.ok?r.json():null)]);}catch(e){CALLS=null;}
  const sel=$('#rsel');sel.innerHTML=REPORTS.map(r=>`<option value="${r.date}">${r.date}</option>`).join('');
  sel.onchange=()=>renderReport(sel.value);
  renderCards();renderSectors();renderReport(REPORTS[0]?.date);renderAI();renderIdx().catch(e=>{$('#idxbody').textContent='読み込みエラー: '+e.message;});
}
new ResizeObserver(es=>{const w=es[0].contentRect.width;$('#sectors').classList.toggle('narrow',w<1000);}).observe($('#sectors'));
document.querySelectorAll('#period button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#period button').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.period=b.dataset.p;state.sort={key:b.dataset.p,dir:-1};renderCards();renderSectors();});
document.querySelectorAll('#market button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#market button').forEach(x=>x.classList.remove('on'));b.classList.add('on');state.market=b.dataset.m;renderCards();renderSectors();renderIdx();});
load().catch(e=>{$('#meta').textContent='読み込みエラー: '+e.message;});
</script>
